# PostgreSQL 17 para desarrollo local.
# En producción la base es gestionada (§9 del PRD); esto es solo para trabajar.
services:
  db:
    image: postgres:17
    container_name: umlive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: umlive
      POSTGRES_PASSWORD: umlive
      POSTGRES_DB: umlive
    ports:
      # NOTA (descubierto durante `sdd-apply` de `auth`, 2026-09-12): el puerto
      # 5432 del host ya está ocupado por un contenedor de OTRO proyecto en
      # esta máquina (`mizenplace-postgres`), corriendo desde antes. Publicar
      # ahí no falla ruidosamente: el contenedor de este proyecto queda vivo
      # pero SIN el puerto publicado, y cualquier cliente que hable a
      # localhost:5432 termina hablando con la base ajena — el síntoma es un
      # rechazo de autenticación que no tiene nada que ver con las credenciales
      # de este proyecto. Se remapea a 5434 (libre) solo en el host; el
      # contenedor sigue escuchando 5432 puertas adentro.
      - "5434:5432"
    volumes:
      - umlive-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umlive -d umlive"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  umlive-pgdata:

# NOTA (M7, 2026-09-19): este compose levanta SOLO la base de desarrollo.
#
# ⚠️ El compose que se usa en la defensa es el de la RAÍZ del repositorio:
# `docker-compose.yml` (proyecto `umlive-offline`) — plataforma completa
# offline: `db` + `migrate` + `api` con la web compilada. Componer las dos
# apps es por eso que vive en la raíz y no acá.
#
# Este archivo NO es el de la defensa: publica el 5434 y lee credenciales
# fijas de desarrollo. Si en el aula se arranca el compose equivocado, no hay
# plataforma que demostrar. `docker compose -f docker-compose.yml up` desde la
# raíz es el comando correcto. Ver PRD §10, Demo Configuration.
